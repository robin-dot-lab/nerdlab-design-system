<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nerdlab Events — Dashboard</title>
  <link rel="icon" href="data:,">
  <!-- Theme set before first paint (no flash); App keeps it in sync afterwards. -->
  <script>
    try { document.documentElement.dataset.palette = localStorage.getItem('nl-dashboard-palette') || 'candy'; } catch (e) {}
    try { document.documentElement.dataset.theme = localStorage.getItem('nl-dashboard-theme') || 'auto'; } catch (e) { document.documentElement.dataset.theme = 'auto'; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
