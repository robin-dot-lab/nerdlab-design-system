name: CI

# The same checks as `pnpm test`, spread over parallel machines:
#   packages   build, typecheck, unit tests, token and pixel parity, dashboard e2e (3 engines)
#   storybook  one Storybook build, shared with the six shards below as an artifact
#   shards     a11y audit (desktop / phone), visual regression (desktop-light / phone-dark),
#              cross-browser smoke (firefox / webkit), and the a11y audit of each extra palette
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages, parity, dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Google Chrome is preinstalled on ubuntu-latest (Playwright channel "chrome");
      # Firefox and WebKit come from Playwright, for the dashboard e2e.
      - run: node node_modules/playwright-core/cli.js install --with-deps firefox webkit
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test --filter=!@robin-dot-lab/docs

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@robin-dot-lab/docs...
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static/
          retention-days: 3

  stories:
    name: Stories — ${{ matrix.name }}
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: a11y desktop, script: a11y-audit.mjs, env: VIEWPORT=desktop }
          - { name: a11y phone, script: a11y-audit.mjs, env: VIEWPORT=phone }
          - { name: visual desktop-light, script: visual.mjs, env: VARIANT=desktop-light }
          - { name: visual phone-dark, script: visual.mjs, env: VARIANT=phone-dark }
          - { name: firefox, script: cross-browser.mjs, env: ENGINE=firefox, browser: firefox }
          # Each extra palette: every story, light and dark, desktop width (Candy is covered above).
          - { name: a11y palette sorbet, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=sorbet }
          - { name: a11y palette ink, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=ink }
          - { name: a11y palette terracotta, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=terracotta }
          - { name: a11y palette slate, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=slate }
          - { name: a11y palette moss, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=moss }
          - { name: a11y palette mono-retro, script: a11y-audit.mjs, env: VIEWPORT=desktop PALETTE=mono-retro }
          - { name: webkit, script: cross-browser.mjs, env: ENGINE=webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser
        run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static/
      - name: Run ${{ matrix.script }} (${{ matrix.env }})
        working-directory: apps/docs
        run: env ${{ matrix.env }} node scripts/${{ matrix.script }}
      - name: Upload visual diffs
        if: failure() && matrix.script == 'visual.mjs'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ strategy.job-index }}
          path: apps/docs/test/visual/__diff__/
          if-no-files-found: ignore
