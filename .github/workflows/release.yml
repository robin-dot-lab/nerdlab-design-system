name: Release

# Publishes the four packages to GitHub Packages (npm.pkg.github.com, scope @robin-dot-lab).
# With pending changesets it opens (or updates) a "Version Packages" pull request; once that is
# merged and this workflow runs again, every package whose version is not yet on the registry
# is published, tagged, and gets a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Authenticate the scope against GitHub Packages with the workflow's own token.
      - name: Configure the registry
        run: |
          echo "@robin-dot-lab:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # changesets/action does not pick up the tags printed by changeset publish (CLI v3), so it
      # neither pushes them nor creates releases: do both explicitly, idempotently.
      - name: Tag and release published versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in packages/*/package.json; do
            name=$(node -p "require('./$f').name"); version=$(node -p "require('./$f').version")
            tag="$name@$version"
            # changeset publish may already have created the tag locally: create it only if missing, then push.
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              changelog="$(dirname "$f")/CHANGELOG.md"
              if [ -f "$changelog" ]; then
                notes=$(awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' "$changelog")
              else
                notes="First release of $name."
              fi
              gh release create "$tag" --title "$tag" --notes "${notes:-$name $version}"
            fi
          done
