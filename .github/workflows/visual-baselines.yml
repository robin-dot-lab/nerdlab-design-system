name: Update visual baselines

# Font rasterisation differs between macOS and Linux, so each platform keeps its own
# screenshots (apps/docs/test/visual/<platform>/). Run this after an intended visual
# change, or once after adding stories, to refresh the Linux set used by CI.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nerdlab/docs... build
      - run: pnpm --filter @nerdlab/docs visual:update
      - name: Commit the Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/test/visual/linux
          git diff --cached --quiet || git commit -m "test: update Linux visual baselines"
          git push
