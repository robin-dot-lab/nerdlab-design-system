name: Consumer check

# After every release, install the published packages into a blank Vite app (tools/consumer-check),
# exactly as the README says, build it and check it in Chrome. Catches what CI cannot see from inside
# the workspace: missing files in a tarball, broken exports or types, wrong install instructions.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Let the registry settle after a release
        if: github.event_name == 'workflow_run'
        run: sleep 30
      # A Release run that only opened the "Version Packages" pull request published nothing: the
      # versions in this checkout are not on the registry yet, and installing them would fail.
      - name: Are this checkout's versions published?
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          missing=""
          for f in packages/*/package.json; do
            spec=$(node -p "const j=require('./$f'); j.private ? '' : j.name + '@' + j.version")
            [ -z "$spec" ] && continue
            npm view "$spec" version --registry=https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/.npmrc" >/dev/null 2>&1 || missing="$missing $spec"
          done
          if [ -n "$missing" ]; then echo "not published yet:$missing (nothing to check)"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.published.outputs.ok == 'true'
        run: tools/consumer-check/run.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
